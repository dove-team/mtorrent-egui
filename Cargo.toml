[package]
name = "mtorrent-egui"
version = "0.10.1"
description = "egui version for mtorrent"
edition = "2024"
authors = ["Mikhail Vasilyev <mikail.vasilyev@gmail.com>"]
license = "Apache-2.0"

[dependencies]
rfd = "0.17.2"
log = "0.4.34"
image = "0.25.10"
mtorrent = "0.10.1"
rust-i18n = "4.2.4"
dirs-next = "2.0.0"
file-rotate = "0.8.0"
env_logger = "0.11.11"
parking_lot = "0.13.0"
eframe = { version = "0.37.0", features = ["default"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
